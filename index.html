
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My DevOps Project</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e0c3fc, #8ec5fc);
            text-align: center;
            padding: 80px 20px;
            margin: 0;
        }

        .container {
            background: white;
            max-width: 650px;
            margin: auto;
            padding: 40px 25px;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h1 {
            color: #593a91;
        }

        h2 {
            color: #3974ad;
        }

        p {
            color: #555;
            font-size: 17px;
        }

        .status {
            color: green;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Welcome to My DevOps Project!</h1>

        <h2>CI/CD Pipeline Using GitHub Actions</h2>

        <p>
            This website is automatically built and deployed
            using GitHub Actions.
        </p>

        <p>Continuous Integration and Continuous Deployment</p>

        <p class="status">Deployment Status: Successful</p>
    </div>
</body>
</html>
